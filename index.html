<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neighborhood Simulation</title>
<style>
  :root {
    --panel: rgba(17, 21, 29, .84);
    --panel-line: rgba(255, 255, 255, .10);
    --fg: #eef2f7;
    --muted: #96a3b5;
    --accent: #ffd21f;
    --good: #6fdc8c;
    --bad: #ff7a7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fb7dc; color: var(--fg);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; outline: none; }
  .panel { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px;
    box-shadow: 0 8px 28px rgba(0,0,0,.35); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

  #brand { position: fixed; top: 12px; left: 12px; padding: 9px 14px; }
  #brand b { font-size: 15px; letter-spacing: .2px; }
  #brand span { display: block; color: var(--muted); font-size: 11px; }

  #toolbar { position: fixed; top: 12px; left: 276px; display: flex; gap: 6px;
    padding: 7px; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 660px); }
  #toolbar .grp { display: flex; gap: 5px; padding: 0 6px; border-right: 1px solid var(--panel-line); }
  #toolbar .grp:last-child { border-right: 0; }
  .btn { font: inherit; color: var(--fg); background: rgba(255,255,255,.07); border: 1px solid var(--panel-line);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap; transition: background .12s, border-color .12s; }
  .btn:hover:not(:disabled) { background: rgba(255,255,255,.16); }
  .btn:disabled { opacity: .32; cursor: not-allowed; }
  .btn i { font-style: normal; font-weight: 700; color: var(--accent); width: 1em; text-align: center; }
  .btn.on { background: rgba(255,210,31,.2); border-color: var(--accent); }
  kbd { font: 10px ui-monospace, monospace; color: var(--muted); border: 1px solid var(--panel-line);
    border-radius: 4px; padding: 0 4px; }

  #inspector { position: fixed; top: 12px; right: 12px; bottom: 12px; width: 320px; overflow-y: auto; padding: 14px; }
  #inspector h2 { margin: 0 0 6px; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  #inspector section + section { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--panel-line); }
  .title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .title b { font-size: 18px; }
  .title small { color: var(--muted); font-size: 13px; }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; margin: 6px 0 8px; }
  .chip { font-size: 11px; padding: 1px 8px; border-radius: 99px; background: rgba(255,255,255,.1); }
  .chip.yellow { background: rgba(255,210,31,.22); color: var(--accent); }
  .chip.green { background: rgba(111,220,140,.18); color: var(--good); }
  .chip.gray { background: rgba(255,255,255,.1); color: var(--muted); }
  dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; }
  dt { color: var(--muted); }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  dd small { color: var(--muted); }
  .card { background: rgba(255,255,255,.05); border: 1px solid var(--panel-line); border-radius: 10px; padding: 10px; margin-top: 10px; }
  .card h3 { margin: 0 0 6px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
  .card.hl { border-color: rgba(255,210,31,.55); }
  svg.diagram { width: 100%; height: auto; display: block; margin-bottom: 8px; background: rgba(255,255,255,.04); border-radius: 8px; }
  .floors { display: flex; flex-direction: column-reverse; gap: 2px; width: 22px; }
  .floors div { height: 7px; border-radius: 2px; background: rgba(255,255,255,.14); }
  .floors div.on { background: var(--accent); }
  .hint { color: var(--muted); }
  .hint li { margin: 3px 0; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .stat { background: rgba(255,255,255,.05); border-radius: 8px; padding: 7px 9px; }
  .stat b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 11px; }
  .hist { display: flex; align-items: flex-end; gap: 8px; height: 70px; margin: 6px 0 2px; }
  .hist div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; font-size: 11px; color: var(--muted); }
  .hist div i { display: block; width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .85; }
  .hist div i.v { background: #6b7a8f; }
  .hist div b { color: var(--fg); font-weight: 500; font-size: 11px; }
  .rules { list-style: none; padding: 0; margin: 6px 0 0; }
  .rules li { margin: 2px 0; }
  .rules li::before { content: "✓ "; color: var(--good); font-weight: 700; }
  .rules li.bad::before { content: "✕ "; color: var(--bad); }

  #view { position: fixed; left: 12px; bottom: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; width: 250px; }
  #view label { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
  #view input[type=range] { width: 100%; accent-color: var(--accent); }
  #view .row { display: flex; gap: 6px; }
  #view .row .btn { flex: 1; justify-content: center; }
  .legend { display: flex; gap: 10px; white-space: nowrap; color: var(--muted); font-size: 11px; }
  .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }

  #tag { position: fixed; pointer-events: none; transform: translate(-50%, -100%); padding: 3px 9px; border-radius: 99px;
    background: var(--accent); color: #231c00; font-weight: 600; font-size: 12px; white-space: nowrap;
    box-shadow: 0 3px 10px rgba(0,0,0,.35); display: none; }
  #msg { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: 420px; padding: 8px 14px;
    border-radius: 10px; background: rgba(30,34,42,.95); border: 1px solid var(--panel-line); font-size: 13px;
    opacity: 0; transition: opacity .25s; pointer-events: none; text-align: center; }
  #msg.show { opacity: 1; }
  #msg.err { background: rgba(120,30,30,.95); }

  @media (max-width: 900px) {
    #inspector { top: auto; left: 12px; width: auto; height: 38vh; }
    #view { bottom: calc(38vh + 24px); width: 220px; }
    #brand { display: none; }
    #toolbar { top: 8px; left: 12px; max-width: calc(100vw - 24px); }
    .btn kbd { display: none; }
  }
</style>
</head>
<body>

<div id="brand" class="panel"><b>Neighborhood Simulation</b><span>Suburban lots &amp; houses</span></div>

<div id="toolbar" class="panel">
  <div class="grp">
    <button class="btn" id="b-build"><i>＋</i> Build house <kbd>B</kbd></button>
    <button class="btn" id="b-expand"><i>▲</i> <span id="expand-label">Expand</span> <kbd>E</kbd></button>
    <button class="btn" id="b-demolish"><i>✕</i> Demolish <kbd>D</kbd></button>
  </div>
  <div class="grp">
    <button class="btn" id="b-addlot"><i>▣</i> Add lot <kbd>A</kbd></button>
    <button class="btn" id="b-removelot"><i>▢</i> Remove lot <kbd>R</kbd></button>
  </div>
  <div class="grp">
    <button class="btn" id="b-buildall">Build on all vacant</button>
    <button class="btn" id="b-demolishall">Demolish all</button>
    <button class="btn" id="b-grow"><i>▶</i> <span>Auto-grow</span></button>
  </div>
</div>

<aside id="inspector" class="panel">
  <section id="sel"></section>
  <section id="hood"></section>
</aside>

<div id="view" class="panel">
  <label>Time of day <b id="time-label"></b></label>
  <input type="range" id="time" min="5" max="21" step="0.25" value="15.5">
  <div class="row">
    <button class="btn" id="b-reset">Reset view</button>
    <button class="btn" id="b-top">Top view</button>
  </div>
  <div class="legend"><span style="--c:#ffd21f">Selected</span><span style="--c:#fff3a8">Parent lot</span><span style="--c:#b9ab7e">Unparcelled</span></div>
</div>

<div id="tag"></div>
<div id="msg"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
 * 1. SEMANTIC MODEL
 *
 *   Neighborhood 1 ── * Lot            Lot 1 ── (0..1) House
 *   Lot   { id, area (m²), boundary (polyline of {x,z}), house, active }
 *   House { floors }
 *
 * "active" distinguishes a parcelled lot from unparcelled land, so that
 * lots can be removed/added while the rules below stay enforced:
 *   - a house must exist on a (parcelled) lot
 *   - a lot has zero or one house
 *   - a neighborhood has at least MIN_LOTS lots
 * ===================================================================== */
const MIN_LOTS = 10, MAX_FLOORS = 4, FLOOR_H = 3.1;

// street grid
const ST = 12, SW = 3;                 // street width, sidewalk width (m)
const BW = 112, BD = 76;               // block width / depth (m)
const BX = 4, BZ = 3;                  // blocks across / down
const PARK = { bx: 2, bz: 1 };
const TOTAL_W = BX * BW + (BX + 1) * ST;
const TOTAL_D = BZ * BD + (BZ + 1) * ST;
const H_STREETS = ['Maple St', 'Oak St', 'Elm St', 'Cedar St'];                  // run east-west
const V_STREETS = ['1st Ave', '2nd Ave', '3rd Ave', '4th Ave', '5th Ave'];       // run north-south
const PAD_Y = 0.14;                     // top of the sidewalk pad
const GROUND_Y = PAD_Y + 0.03;          // lot surface, just above the pad (avoids z-fighting)

function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const rng = mulberry32(20260);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const dist = (p, q) => Math.hypot(p.x - q.x, p.z - q.z);

function polygonArea(pts) {                 // shoelace formula
  let a = 0;
  for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length]; a += p.x * q.z - q.x * p.z; }
  return Math.abs(a) / 2;
}
const polygonPerimeter = pts => pts.reduce((s, p, i) => s + dist(p, pts[(i + 1) % pts.length]), 0);

const WALLS = [
  { name: 'Cream', c: 0xefe3c8 }, { name: 'Sage', c: 0xb4c6a2 }, { name: 'Sky blue', c: 0xa5c0d8 },
  { name: 'Clay', c: 0xd9a58c }, { name: 'Gray', c: 0xc6cad0 }, { name: 'Butter', c: 0xf0dc96 },
  { name: 'Brick red', c: 0xb0604e }, { name: 'Navy', c: 0x56708f },
];
const ROOFS = [
  { name: 'Charcoal', c: 0x3d4047 }, { name: 'Brown', c: 0x6b4a3a }, { name: 'Slate', c: 0x56606b }, { name: 'Terracotta', c: 0xa5503a },
];
const DOORS = [0x7a2e2e, 0x2e4a6b, 0x2f5a3f, 0x3a2a20, 0xc79a2e];

const plots = [];                       // every parcel ever laid out (active or not)
const activeLots = () => plots.filter(p => p.active);
let nextId = 1;

function lotPoint(lot, u, v) {          // bilinear point inside the (quad) boundary; v=0 at street
  const [a, b, c, d] = lot.boundary;
  const f = { x: lerp(a.x, b.x, u), z: lerp(a.z, b.z, u) }, k = { x: lerp(d.x, c.x, u), z: lerp(d.z, c.z, u) };
  return { x: lerp(f.x, k.x, v), z: lerp(f.z, k.z, v) };
}

function makeStyle(lot) {
  const r = mulberry32(1000 + lot.id * 7919);
  const garage = r() < 0.85 ? (r() < 0.65 ? 2 : 1) : 0;
  return {
    w: clamp(lot.frontage * 0.5, 9, 13.5), d: 9.5 + r() * 3, setback: 6.5 + r() * 3,
    garage, gW: garage === 2 ? 5.8 : garage === 1 ? 3.4 : 0, gD: 7, gSide: garage ? (r() < 0.5 ? -1 : 1) : 0,
    roofType: r() < 0.5 ? 'gable' : 'hip',
    wall: Math.floor(r() * WALLS.length), roof: Math.floor(r() * ROOFS.length), door: Math.floor(r() * DOORS.length),
    chimney: r() < 0.4,
  };
}

// lay out the grid of blocks; each block has two back-to-back rows of 4 lots
const blockOrigin = (bx, bz) => ({ x: -TOTAL_W / 2 + ST + bx * (BW + ST), z: -TOTAL_D / 2 + ST + bz * (BD + ST) });
for (let bz = 0; bz < BZ; bz++) for (let bx = 0; bx < BX; bx++) {
  if (bx === PARK.bx && bz === PARK.bz) continue;
  const o = blockOrigin(bx, bz), cz = o.z + BD / 2;
  const x0 = o.x + SW, usable = BW - 2 * SW;
  const wts = [0, 1, 2, 3].map(() => 0.85 + rng() * 0.3), sum = wts.reduce((a, b) => a + b, 0);
  const xf = [x0]; wts.forEach(w => xf.push(xf[xf.length - 1] + usable * w / sum));
  const xb = xf.map((x, k) => x + (k === 0 || k === 4 ? 0 : (rng() - .5) * 3));       // skewed side lines
  const zb = xf.map(() => cz + (rng() - .5) * 3);                                     // wobbly back line (shared)
  for (let row = 0; row < 2; row++) {
    const zf = row === 0 ? o.z + SW : o.z + BD - SW;
    const street = H_STREETS[bz + row];
    for (let k = 0; k < 4; k++) {
      const boundary = [{ x: xf[k], z: zf }, { x: xf[k + 1], z: zf }, { x: xb[k + 1], z: zb[k + 1] }, { x: xb[k], z: zb[k] }];
      const lot = { id: nextId++, bx, bz, row, k, boundary, area: polygonArea(boundary), perimeter: polygonPerimeter(boundary),
        frontage: dist(boundary[0], boundary[1]), depth: (dist(boundary[1], boundary[2]) + dist(boundary[3], boundary[0])) / 2,
        corner: k === 0 || k === 3, street, house: null, active: true, trees: [] };
      lot.number = 100 * (bz + row + 1) + 4 * (bx * 4 + k) + (row === 0 ? 2 : 1);
      lot.address = `${lot.number} ${street}`;
      lot.block = `Block ${String.fromCharCode(65 + bz)}${bx + 1}`;
      lot.inward = row === 0 ? 1 : -1;          // +z or -z: direction from the street into the lot
      lot.style = makeStyle(lot);
      plots.push(lot);
    }
  }
}

// ---- actions (each enforces the rules and reports the outcome) ----
const ok = m => ({ ok: true, m }), fail = m => ({ ok: false, m });
function buildHouse(lot) {
  if (!lot.active) return fail(`${lot.block} plot ${lot.id} is unparcelled land — a house must exist on a lot.`);
  if (lot.house) return fail(`${lot.address} already has a house (a lot holds at most one).`);
  lot.house = { floors: 1 }; visuals.house(lot, 'build');
  return ok(`Built a house at ${lot.address}.`);
}
function demolishHouse(lot) {
  if (!lot.house) return fail(`${lot.address} has no house to demolish.`);
  lot.house = null; visuals.house(lot, 'demolish');
  return ok(`Demolished the house at ${lot.address}.`);
}
function expandHouse(lot) {
  if (!lot.house) return fail('A house must exist on the lot before it can be expanded.');
  if (lot.house.floors >= MAX_FLOORS) return fail(`${lot.address} already has the maximum ${MAX_FLOORS} floors.`);
  lot.house.floors++; visuals.house(lot, 'expand');
  return ok(`Expanded ${lot.address} to ${lot.house.floors} floors.`);
}
function removeLot(lot) {
  if (!lot.active) return fail('That plot is already unparcelled.');
  if (activeLots().length <= MIN_LOTS) return fail(`A neighborhood must keep at least ${MIN_LOTS} lots.`);
  if (lot.house) demolishHouse(lot);                // a house cannot outlive its lot
  lot.active = false; visuals.lot(lot);
  return ok(`Removed lot ${lot.address} (now unparcelled land).`);
}
function addLot(lot) {
  if (lot.active) return fail('That plot is already a lot.');
  lot.active = true; visuals.lot(lot);
  return ok(`Created a lot at ${lot.address}.`);
}

function validate() {
  const act = activeLots();
  return [
    { ok: act.length >= MIN_LOTS, text: `At least ${MIN_LOTS} lots (${act.length})` },
    { ok: plots.every(p => p.active || !p.house), text: 'Every house sits on a lot' },
    { ok: plots.every(p => !p.house || (Number.isInteger(p.house.floors) && p.house.floors >= 1 && p.house.floors <= MAX_FLOORS)), text: `Houses have 1–${MAX_FLOORS} floors` },
    { ok: true, text: 'Each lot has zero or one house' },
  ];
}

// derived measures
function houseMetrics(lot) {
  const s = lot.style, f = lot.house.floors;
  const main = s.w * s.d, garage = s.gW * s.gD;
  const gfa = main * f, bedrooms = clamp(Math.round(gfa / 62), 1, 6);
  return { floors: f, height: f * FLOOR_H + (s.d + 1) / 2 * 0.5, footprint: main + garage, main, garage, gfa, bedrooms,
    residents: Math.max(1, Math.round(gfa / 50 + 1)), far: gfa / lot.area, coverage: (main + garage) / lot.area };
}

// seed the demo: roughly three quarters of lots start built
for (const lot of plots) {
  if (rng() < 0.74) { const r = rng(); lot.house = { floors: r < .38 ? 1 : r < .82 ? 2 : r < .96 ? 3 : 4 }; }
}

/* =====================================================================
 * 2. RENDERER, SCENE, LIGHTS
 * ===================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfe7f7, 650, 1700);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 3, 2200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2 - 0.04; controls.minDistance = 18; controls.maxDistance = 900;
controls.screenSpacePanning = false;
const HOME = { target: new THREE.Vector3(60, 0, 5), pos: new THREE.Vector3(60, 380, 480) };
const TOP = { target: new THREE.Vector3(55, 0, 0), pos: new THREE.Vector3(55, 640, 1) };
camera.position.copy(HOME.pos); controls.target.copy(HOME.target); controls.update();

const hemi = new THREE.HemisphereLight(0xcfe6ff, 0x6d8a55, 0.8); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 3); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -330, right: 330, top: 200, bottom: -200, near: 50, far: 1200 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.6;
scene.add(sun, sun.target);
const moon = new THREE.DirectionalLight(0x6f88c8, 0); moon.position.set(-200, 300, -120); scene.add(moon);

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color() }, bottom: { value: new THREE.Color() } },
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform vec3 top; uniform vec3 bottom; varying vec3 vP;
    void main(){ float t = pow(max(normalize(vP).y, 0.0), 0.5); gl_FragColor = vec4(mix(bottom, top, t), 1.0);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1900, 32, 16), skyMat);
sky.frustumCulled = false; sky.renderOrder = -1; scene.add(sky);

/* ---- procedural textures ---- */
function noiseTexture(base, speckles, size = 256) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); g.fillStyle = base; g.fillRect(0, 0, size, size);
  const r = mulberry32(5);
  for (let i = 0; i < size * size / 10; i++) { g.fillStyle = speckles[Math.floor(r() * speckles.length)]; g.fillRect(r() * size, r() * size, 1 + r() * 2, 1 + r() * 2); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso;
  return t;
}
const grassTex = noiseTexture('#6c9f55', ['#5f9249', '#79ad61', '#699b52', '#80b266', '#5a8a45']);
grassTex.repeat.set(1 / 7, 1 / 7);
const grassTexWide = grassTex.clone(); grassTexWide.needsUpdate = true; grassTexWide.repeat.set(200, 200);
const asphaltTex = noiseTexture('#3b3e43', ['#34373b', '#45484d', '#3f4247', '#2f3236']);
asphaltTex.repeat.set(TOTAL_W / 6, TOTAL_D / 6);

/* ---- materials ---- */
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.9, metalness: 0, ...o });
const matGround = std(0xffffff, { map: grassTexWide });
const matAsphalt = std(0xffffff, { map: asphaltTex, roughness: 0.95 });
const matSidewalk = std(0xcbc8c0, { roughness: 0.95 });
const matGrassVariants = [0xffffff, 0xf1fadf, 0xe4f1d2, 0xfff6df].map(c => std(c, { map: grassTex }));
const matUnparcel = std(0xb9ab7e, { roughness: 1 });

function addTree(x, z, r = 2 + rng() * 1.6) {
  const i = treeMats.length; if (i >= TREE_CAP) return -1;
  const th = 2.2 + r * 0.5, q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), rng() * 6.28);
  const t = new THREE.Matrix4().compose(new THREE.Vector3(x, GROUND_Y, z), new THREE.Quaternion(), new THREE.Vector3(1, th, 1));
  const c = new THREE.Matrix4().compose(new THREE.Vector3(x, GROUND_Y + th + r * 0.55, z), q, new THREE.Vector3(r, r * 0.9, r));
  treeMats.push({ t, c }); trunkIM.setMatrixAt(i, t); crownIM.setMatrixAt(i, c);
  crownIM.setColorAt(i, rng() < 0.08 ? AUTUMN[Math.floor(rng() * 2)] : GREENS[Math.floor(rng() * GREENS.length)]);

}

const localToWorld = (lot, lx, lz) => {   // house-local (front = +z) -> world
  const s = lot.style, sx = lot.row === 0 ? -1 : 1, fc = lotPoint(lot, 0.5, 0);
  const ox = fc.x - sx * s.gSide * s.gW / 2, oz = fc.z + lot.inward * (s.setback + s.d / 2);
  return { x: ox + sx * lx, z: oz + sx * lz, ox, oz };
};

function buildHouseGroup(lot) {
  const s = lot.style, f = lot.house.floors, { w, d } = s, H = f * FLOOR_H;
  const P = { wall: [], trim: [], roof: [], glass: [], door: [], brick: [], garage: [], conc: [] };
  const box = (k, sx, sy, sz, x, y, z) => { const g = new THREE.BoxGeometry(sx, sy, sz); g.translate(x, y, z); P[k].push(g); };
  const frontWin = (x, y) => { box('trim', 1.8, 1.6, 0.18, x, y, d / 2); box('glass', 1.4, 1.2, 0.24, x, y, d / 2); };
  const sideWin = (x, y) => { box('trim', 0.18, 1.6, 1.8, x, y, 0); box('glass', 0.24, 1.2, 1.4, x, y, 0); };

  box('wall', w, H, d, 0, H / 2, 0);
  box('conc', w + 0.2, 0.5, d + 0.2, 0, 0.25, 0);                                // foundation
  for (let i = 1; i < f; i++) box('trim', w + 0.14, 0.2, d + 0.14, 0, i * FLOOR_H, 0);   // floor bands

  // windows, door
  const doorX = s.gSide ? -s.gSide * 0.18 * w : 0;
  const groundWins = s.gSide ? [s.gSide * 0.28 * w, -s.gSide * 0.40 * w] : [-0.3 * w, 0.3 * w];
  for (let i = 0; i < f; i++) {
    const y = i * FLOOR_H + 1.9;
    (i === 0 ? groundWins : [-0.3 * w, 0.3 * w]).forEach(x => frontWin(x, y));
    sideWin(w / 2, y); sideWin(-w / 2, y);
  }
  box('door', 1.2, 2.2, 0.16, doorX, 1.2, d / 2);
  box('trim', 2.6, 0.18, 1.7, doorX, 2.8, d / 2 + 0.85);                          // porch awning
  box('trim', 0.14, 2.7, 0.14, doorX - 1.15, 1.45, d / 2 + 1.6); box('trim', 0.14, 2.7, 0.14, doorX + 1.15, 1.45, d / 2 + 1.6);
  box('conc', 2.2, 0.2, 1.0, doorX, 0.1, d / 2 + 0.55);                           // step
  const walkLen = s.setback + SW;
  box('conc', 1.3, 0.06, walkLen, doorX, 0.03, d / 2 + walkLen / 2);               // front walk

  // roof
  const rh = s.roofType === 'gable' ? (d + 1.2) / 2 * 0.5 : 2.8;
  if (s.roofType === 'gable') {
    const sh = new THREE.Shape(); sh.moveTo(-(d + 1.2) / 2, 0); sh.lineTo((d + 1.2) / 2, 0); sh.lineTo(0, rh); sh.closePath();
    const g = new THREE.ExtrudeGeometry(sh, { depth: w + 1.2, bevelEnabled: false }); g.rotateY(Math.PI / 2); g.translate(-(w + 1.2) / 2, H, 0); P.roof.push(g);
  } else {
    const g = new THREE.ConeGeometry(Math.SQRT1_2, 1, 4); g.rotateY(Math.PI / 4); g.scale(w + 1.4, rh, d + 1.4); g.translate(0, H + rh / 2, 0); P.roof.push(g);
  }
  if (s.chimney) {
    const cx = (s.gSide ? -s.gSide : 1) * (w / 2 - 1.1), ch = rh + 1.9;
    box('brick', 0.9, ch, 0.9, cx, H - 1 + ch / 2, -d * 0.2);
  }

  // attached garage with its own small gable and a driveway to the curb
  if (s.garage) {
    const gx = s.gSide * (w / 2 + s.gW / 2), gz = d / 2 + 1 - s.gD / 2;
    box('wall', s.gW, 3, s.gD, gx, 1.5, gz);
    const sh = new THREE.Shape(); sh.moveTo(-(s.gW + 0.8) / 2, 0); sh.lineTo((s.gW + 0.8) / 2, 0); sh.lineTo(0, 1.4); sh.closePath();
    const g = new THREE.ExtrudeGeometry(sh, { depth: s.gD + 0.8, bevelEnabled: false }); g.translate(gx, 3, gz - (s.gD + 0.8) / 2); P.roof.push(g);
    box('garage', s.gW - 0.5, 2.3, 0.12, gx, 1.15, d / 2 + 1.02);
    const dl = s.setback + SW - 1;
    box('conc', s.gW - 0.3, 0.06, dl, gx, 0.03, d / 2 + 1 + dl / 2);
  }

  const mats = { wall: wallMats[s.wall], trim: matTrim, roof: roofMats[s.roof], glass: matGlass, door: doorMats[s.door], brick: matBrick, garage: matGarageDoor, conc: matConcrete };
  const group = new THREE.Group();
  for (const k of Object.keys(P)) {
    if (!P[k].length) continue;
    const merged = mergeGeometries(P[k].map(g => g.index ? g.toNonIndexed() : g));
    P[k].forEach(g => g.dispose());
    const mesh = new THREE.Mesh(merged, mats[k]);
    mesh.castShadow = k !== 'conc'; mesh.receiveShadow = true;
    if (k === 'wall') group.userData.wallMesh = mesh;
    group.add(mesh);
  }
  const pos = localToWorld(lot, 0, 0);
  group.position.set(pos.ox, GROUND_Y, pos.oz); group.rotation.y = lot.row === 0 ? Math.PI : 0;
  group.userData.lot = lot; group.userData.part = 'house';
  return group;
}
const disposeGroup = g => g.traverse(o => { if (o.geometry) o.geometry.dispose(); });

let sel = { lot: null, part: null }, hover = { lot: null, part: null };
const isSel = (lot, part) => sel.lot === lot && sel.part === part, isHov = (lot, part) => hover.lot === lot && hover.part === part;

function refreshVisual(lot) {
  if (!lot.active) lot.mesh.material = isSel(lot, 'lot') ? matLotSel : isHov(lot, 'lot') ? matLotHover : matUnparcel;
  else lot.mesh.material = isSel(lot, 'lot') ? matLotSel : sel.lot === lot ? matLotCtx : isHov(lot, 'lot') ? matLotHover : matGrassVariants[lot.id % 4];
  lot.outline.material = lot.active ? lineSolid : lineDash;
  if (lot.houseGroup) lot.houseGroup.userData.wallMesh.material = isSel(lot, 'house') ? matWallSel : isHov(lot, 'house') ? matWallHover : wallMats[lot.style.wall];
}

const anims = [];
const easeOutBack = t => 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2);
function animate(dur, update, done) { anims.push({ t0: performance.now(), dur, update, done }); }

const visuals = {
  house(lot, mode) {                       // (re)build a lot's house mesh to match the model
    const old = lot.houseGroup; lot.houseGroup = null;
    if (old) {
      if (mode === 'demolish') animate(300, k => old.scale.y = Math.max(0.01, 1 - k), () => { housesGroup.remove(old); disposeGroup(old); });
      else { housesGroup.remove(old); disposeGroup(old); }
    }
    if (lot.house) {
      const g = buildHouseGroup(lot); lot.houseGroup = g; housesGroup.add(g);
      if (mode === 'build') animate(550, k => g.scale.y = Math.max(0.01, easeOutBack(k)));
      if (mode === 'expand') { const from = (lot.house.floors - 1) / lot.house.floors; animate(450, k => g.scale.y = lerp(from, 1, easeOutBack(k))); }
    }
    refreshVisual(lot);
    if (sel.lot === lot && sel.part === 'house' && !lot.house) sel = { lot, part: 'lot' };
    refreshVisual(lot);
  },
  lot(lot) {                               // parcel added/removed
    setTreesVisible(lot, lot.active); refreshVisual(lot);
  },
};
for (const lot of plots) if (lot.house) visuals.house(lot, 'none');

function updateRibbon() {
  ribbonGroup.clear();
  if (!sel.lot) return;
  const b = sel.lot.boundary;
  for (let i = 0; i < 4; i++) {
    const p = b[i], q = b[(i + 1) % 4], len = dist(p, q);
    const m = new THREE.Mesh(new THREE.BoxGeometry(len + 0.5, 0.14, 0.55), matRibbon);
    m.position.set((p.x + q.x) / 2, GROUND_Y + 0.1, (p.z + q.z) / 2); m.rotation.y = -Math.atan2(q.z - p.z, q.x - p.x);
    ribbonGroup.add(m);
  }
}

const C = hex => new THREE.Color(hex);
function setTime(h) {
  const a = (h - 6) / 12 * Math.PI, elev = Math.sin(a);
  const day = smooth(-0.04, 0.35, elev), warm = (1 - smooth(0.05, 0.45, elev)) * day, night = 1 - day;
  sun.position.set(-Math.cos(a) * 520, Math.max(elev, 0.02) * 520, 180);
  sun.intensity = 3.1 * day; sun.color.set(0xffffff).lerp(C(0xffa869), warm); sun.castShadow = elev > 0.03;
  moon.intensity = 1.1 * night;
  hemi.intensity = lerp(0.5, 0.85, day); hemi.color.set(0x9fb2e0).lerp(C(0xcfe6ff), day); hemi.groundColor.set(0x3a4258).lerp(C(0x6d8a55), day);
  const top = C(0x070c1e).lerp(C(0x4a8fdc), day), bottom = C(0x1a2644).lerp(C(0xcfe7f7), day).lerp(C(0xf3a878), warm * 0.8);
  skyMat.uniforms.top.value.copy(top); skyMat.uniforms.bottom.value.copy(bottom); scene.fog.color.copy(bottom);
  matGlass.emissiveIntensity = night * 1.4; matLampHead.emissiveIntensity = night * 2.5;
  const hh = Math.floor(h) % 24, mm = Math.round((h % 1) * 60);
  $('time-label').textContent = `${((hh + 11) % 12) + 1}:${String(mm).padStart(2, '0')} ${hh < 12 ? 'AM' : 'PM'}`;
}

function lotDiagram(lot) {
  const xs = lot.boundary.map(p => p.x), zs = lot.boundary.map(p => p.z);
  const minx = Math.min(...xs) - 4, maxx = Math.max(...xs) + 4, minz = Math.min(...zs) - 4, maxz = Math.max(...zs) + 4;
  const k = 280 / (maxx - minx), W = 280, Hh = (maxz - minz) * k;
  const P = (x, z) => `${((x - minx) * k).toFixed(1)},${((z - minz) * k).toFixed(1)}`;
  const poly = pts => pts.map(p => P(p.x, p.z)).join(' ');
  const rect = (lot, x0, x1, z0, z1) => poly([localToWorld(lot, x0, z0), localToWorld(lot, x1, z0), localToWorld(lot, x1, z1), localToWorld(lot, x0, z1)]);
  let s = `<svg class="diagram" viewBox="0 0 ${W} ${Hh.toFixed(1)}"><polygon points="${poly(lot.boundary)}" fill="${lot.active ? 'rgba(255,210,31,.16)' : 'rgba(185,171,126,.25)'}" stroke="#ffd21f" stroke-width="1.5" ${lot.active ? '' : 'stroke-dasharray="5 3"'}/>`;
  const front = [lot.boundary[0], lot.boundary[1]];
  s += `<line x1="${P(front[0].x, front[0].z).replace(',', '" y1="')}" x2="${P(front[1].x, front[1].z).replace(',', '" y2="')}" stroke="#8a97a8" stroke-width="4"/>`;
  s += `<text x="${W / 2}" y="${lot.row === 0 ? 11 : Hh - 5}" fill="#8a97a8" font-size="9" text-anchor="middle">STREET · ${lot.street}</text>`;
  if (lot.house) {
    const st = lot.style;
    if (st.garage) {
      const g0 = st.gSide * (st.w / 2), g1 = st.gSide * (st.w / 2 + st.gW), zf = st.d / 2 + 1, dz = st.d / 2 + st.setback + SW;
      s += `<polygon points="${rect(lot, Math.min(g0, g1), Math.max(g0, g1), zf, dz)}" fill="#6b7480"/>`;
      s += `<polygon points="${rect(lot, Math.min(g0, g1), Math.max(g0, g1), zf - st.gD, zf)}" fill="#9aa4b3"/>`;
    }
    s += `<polygon points="${rect(lot, -st.w / 2, st.w / 2, -st.d / 2, st.d / 2)}" fill="#${WALLS[st.wall].c.toString(16).padStart(6, '0')}" stroke="${sel.part === 'house' ? '#ffd21f' : '#222'}" stroke-width="${sel.part === 'house' ? 2 : 1}"/>`;
    const c = localToWorld(lot, 0, 0);
    s += `<text x="${((c.x - minx) * k).toFixed(1)}" y="${((c.z - minz) * k + 4).toFixed(1)}" font-size="12" font-weight="700" fill="#222" text-anchor="middle">${lot.house.floors}F</text>`;
  }
  return s + '</svg>';
}

const row = (a, b) => `<dt>${a}</dt><dd>${b}</dd>`;
function renderSelection() {
  const el = $('sel'), lot = sel.lot;
  if (!lot) {
    el.innerHTML = `<h2>Selection</h2><ul class="hint" style="margin:0;padding-left:18px">
      <li>Click a <b style="color:#ffd21f">lot</b> or a <b style="color:#ffd21f">house</b> to inspect it.</li>
      <li>Double-click to zoom to it.</li><li>Drag to orbit, right-drag to pan, wheel to zoom.</li>
      <li>Shortcuts: B build · E expand · D demolish · A add lot · R remove lot · Esc clear.</li></ul>`;
    return;
  }
  const m = lot.house ? houseMetrics(lot) : null;
  const status = !lot.active ? '<span class="chip gray">Unparcelled land</span>' : lot.house ? '<span class="chip green">Occupied</span>' : '<span class="chip yellow">Vacant</span>';
  let html = `<h2>Selection · ${sel.part === 'house' ? 'House' : lot.active ? 'Lot' : 'Land'}</h2>
    <div class="title"><b>${lot.active ? 'Lot ' + lot.id : 'Plot ' + lot.id}</b><small>${lot.address}</small></div>
    <div class="chips">${status}${lot.corner ? '<span class="chip">Corner lot</span>' : ''}<span class="chip">${lot.block}</span></div>
    ${lotDiagram(lot)}
    <div class="card ${sel.part === 'lot' ? 'hl' : ''}"><h3>Lot</h3><dl>
      ${row('Area', `${fmt(lot.area)} m² <small>(${sqft(lot.area)} ft²)</small>`)}
      ${row('Boundary', `polyline · ${lot.boundary.length} vertices`)}
      ${row('Perimeter', `${fmt(lot.perimeter, 1)} m`)}
      ${row('Frontage × depth', `${fmt(lot.frontage, 1)} × ${fmt(lot.depth, 1)} m`)}
      ${lot.active ? row('Houses', lot.house ? '1 of max 1' : '0 of max 1') : row('Can hold a house', 'No — not a lot')}
      ${m ? row('Lot coverage', `${fmt(m.coverage * 100, 1)} %`) + row('Floor-area ratio', fmt(m.far, 2)) : ''}
    </dl></div>`;
  if (m) {
    const st = lot.style;
    html += `<div class="card ${sel.part === 'house' ? 'hl' : ''}"><h3>House <span class="floors">${[0, 1, 2, 3].map(i => `<div class="${i < m.floors ? 'on' : ''}"></div>`).join('')}</span></h3><dl>
      ${row('Floors', `${m.floors} <small>of max ${MAX_FLOORS}</small>`)}
      ${row('Height', `${fmt(m.height, 1)} m`)}
      ${row('Footprint', `${fmt(m.footprint)} m² <small>(incl. garage)</small>`)}
      ${row('Floor area', `${fmt(m.gfa)} m² <small>(${sqft(m.gfa)} ft²)</small>`)}
      ${row('Est. bedrooms', m.bedrooms)}${row('Est. residents', m.residents)}
      ${row('Garage', st.garage ? `${st.garage}-car attached` : 'none')}
      ${row('Roof', `${st.roofType === 'gable' ? 'Gable' : 'Hip'}, ${ROOFS[st.roof].name.toLowerCase()}`)}
      ${row('Siding', WALLS[st.wall].name.toLowerCase())}
    </dl></div>`;
  } else if (lot.active) html += `<div class="card"><h3>House</h3><span class="hint">No house on this lot. Use <b>Build house</b> to add one.</span></div>`;
  el.innerHTML = html;
}

function renderNeighborhood() {
  const act = activeLots(), built = act.filter(l => l.house), floors = built.reduce((s, l) => s + l.house.floors, 0);
  const area = act.reduce((s, l) => s + l.area, 0), foot = built.reduce((s, l) => s + houseMetrics(l).footprint, 0);
  const gfa = built.reduce((s, l) => s + houseMetrics(l).gfa, 0), pop = built.reduce((s, l) => s + houseMetrics(l).residents, 0);
  const counts = [1, 2, 3, 4].map(f => built.filter(l => l.house.floors === f).length), vacant = act.length - built.length;
  const max = Math.max(1, ...counts, vacant), bar = (n, lab, cls = '') => `<div><b>${n}</b><i class="${cls}" style="height:${n / max * 100}%"></i>${lab}</div>`;
  $('hood').innerHTML = `<h2>Neighborhood</h2>
    <div class="stats">
      <div class="stat"><b>${act.length}</b><span>lots (min ${MIN_LOTS})</span></div>
      <div class="stat"><b>${built.length}</b><span>houses · ${vacant} vacant</span></div>
      <div class="stat"><b>${fmt(area / 10000, 1)} ha</b><span>parcelled land</span></div>
      <div class="stat"><b>${fmt(foot / area * 100, 1)} %</b><span>built coverage</span></div>
      <div class="stat"><b>${fmt(gfa / 1000, 1)}k m²</b><span>floor area · ${floors} floors</span></div>
      <div class="stat"><b>~${fmt(pop)}</b><span>est. residents</span></div>
    </div>
    <dl>${row('Average floors per house', built.length ? fmt(floors / built.length, 2) : '—')}${row('Housing density', `${fmt(built.length / (area / 10000), 1)} / ha`)}</dl>
    <h2 style="margin-top:12px">Houses by floors</h2>
    <div class="hist">${bar(vacant, 'vacant', 'v')}${counts.map((n, i) => bar(n, i + 1 + 'F')).join('')}</div>
    <h2 style="margin-top:12px">Rules</h2>
    <ul class="rules">${validate().map(c => `<li class="${c.ok ? '' : 'bad'}">${c.text}</li>`).join('')}</ul>`;
}

function updateButtons() {
  const lot = sel.lot, act = activeLots(), h = lot && lot.house;
  $('b-build').disabled = !(lot && lot.active && !lot.house);
  $('b-expand').disabled = !(h && lot.house.floors < MAX_FLOORS);
  $('expand-label').textContent = h && lot.house.floors < MAX_FLOORS ? `Expand ${lot.house.floors}→${lot.house.floors + 1}` : 'Expand';
  $('b-demolish').disabled = !h;
  $('b-addlot').disabled = !(lot && !lot.active);
  $('b-removelot').disabled = !(lot && lot.active && act.length > MIN_LOTS);
  $('b-buildall').disabled = !act.some(l => !l.house);
  $('b-demolishall').disabled = !act.some(l => l.house);
}
function renderUI() { renderSelection(); renderNeighborhood(); updateButtons(); }

function setSelection(s) {
  const prev = sel.lot; sel = s || { lot: null, part: null };
  if (prev) refreshVisual(prev); if (sel.lot) refreshVisual(sel.lot);
  updateRibbon(); renderUI();
}
function run(fn) { if (!sel.lot) return; const r = fn(sel.lot); toast(r); renderUI(); updateRibbon(); }
const actions = {
  build: () => run(buildHouse), expand: () => run(expandHouse), demolish: () => run(demolishHouse),
  addlot: () => run(addLot), removelot: () => run(removeLot),
};
$('b-build').onclick = actions.build; $('b-expand').onclick = actions.expand; $('b-demolish').onclick = actions.demolish;
$('b-addlot').onclick = actions.addlot; $('b-removelot').onclick = actions.removelot;
$('b-buildall').onclick = () => { let n = 0; activeLots().forEach(l => { if (!l.house && buildHouse(l).ok) n++; }); toast(ok(`Built ${n} houses on vacant lots.`)); renderUI(); };
$('b-demolishall').onclick = () => { let n = 0; activeLots().forEach(l => { if (demolishHouse(l).ok) n++; }); toast(ok(`Demolished ${n} houses.`)); renderUI(); };

// auto-grow: random legal build / expand steps
let growing = false, growTimer = 0;
function growStep() {
  const act = activeLots(), vac = act.filter(l => !l.house), exp = act.filter(l => l.house && l.house.floors < MAX_FLOORS);
  if (!vac.length && !exp.length) { setGrow(false); toast(ok('Fully built out — growth stopped.')); return; }
  const pickBuild = vac.length && (!exp.length || Math.random() < 0.55);
  const lot = pickBuild ? vac[Math.floor(Math.random() * vac.length)] : exp[Math.floor(Math.random() * exp.length)];
  pickBuild ? buildHouse(lot) : expandHouse(lot); renderUI();
}
function setGrow(on) { growing = on; $('b-grow').classList.toggle('on', on); $('b-grow').innerHTML = on ? '<i>❚❚</i> <span>Pause growth</span>' : '<i>▶</i> <span>Auto-grow</span>'; }
$('b-grow').onclick = () => setGrow(!growing);

// camera helpers
let camAnim = null;
function flyTo(target, pos, dur = 900) { camAnim = { t0: performance.now(), dur, t1: controls.target.clone(), p1: camera.position.clone(), t2: target.clone(), p2: pos.clone() }; }
$('b-reset').onclick = () => flyTo(HOME.target, HOME.pos);
$('b-top').onclick = () => flyTo(TOP.target, TOP.pos);
function focusLot(lot) {
  const c = lotPoint(lot, 0.5, 0.5), t = new THREE.Vector3(c.x, 0, c.z);
  const dir = camera.position.clone().sub(controls.target); dir.y = Math.max(dir.y, 0.5 * dir.length()); dir.setLength(95);
  flyTo(t, t.clone().add(dir));
}
$('time').oninput = e => setTime(parseFloat(e.target.value));

// picking
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(cx, cy) {
  ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  for (const h of ray.intersectObjects([housesGroup, lotsGroup], true)) {
    let o = h.object; while (o && !o.userData.lot) o = o.parent;
    if (o) return { lot: o.userData.lot, part: o.userData.part };
  }
  return null;
}
const cv = renderer.domElement; let down = null, hoverReq = null;
cv.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
cv.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5 || performance.now() - down.t > 600) return;
  setSelection(pick(e.clientX, e.clientY));
});
cv.addEventListener('pointermove', e => { hoverReq = { x: e.clientX, y: e.clientY }; });
cv.addEventListener('pointerleave', () => { hoverReq = { x: -1, y: -1 }; });
cv.addEventListener('dblclick', e => { const p = pick(e.clientX, e.clientY); if (p) { setSelection(p); focusLot(p.lot); } });
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'b') actions.build(); else if (k === 'e') actions.expand(); else if (k === 'd') actions.demolish();
  else if (k === 'a') actions.addlot(); else if (k === 'r') actions.removelot(); else if (e.key === 'Escape') setSelection(null);
});
function applyHover() {
  if (!hoverReq) return;
  const p = hoverReq.x < 0 ? null : pick(hoverReq.x, hoverReq.y); hoverReq = null;
  const prev = hover.lot; hover = p || { lot: null, part: null };
  if (prev) refreshVisual(prev); if (hover.lot) refreshVisual(hover.lot);
  cv.style.cursor = p ? 'pointer' : 'grab';
}

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* =====================================================================
 * 7. MAIN LOOP
 * ===================================================================== */
const tag = $('tag'), tmp = new THREE.Vector3();
function updateTag() {
  const lot = sel.lot; if (!lot) { tag.style.display = 'none'; return; }
  const c = lotPoint(lot, 0.5, 0.5); const top = lot.house ? houseMetrics(lot).height + 3 : 3;
  tmp.set(c.x, GROUND_Y + top, c.z).project(camera);
  if (tmp.z > 1) { tag.style.display = 'none'; return; }
  tag.style.display = 'block'; tag.style.left = (tmp.x * 0.5 + 0.5) * innerWidth + 'px'; tag.style.top = (-tmp.y * 0.5 + 0.5) * innerHeight + 'px';
  tag.textContent = `${lot.address}${lot.house ? ' · ' + lot.house.floors + 'F' : lot.active ? ' · vacant' : ' · unparcelled'}`;
}

let lastGrow = 0;
renderer.setAnimationLoop(now => {
  for (let i = anims.length - 1; i >= 0; i--) {
    const a = anims[i], k = clamp((now - a.t0) / a.dur, 0, 1); a.update(k);
    if (k >= 1) { anims.splice(i, 1); a.done && a.done(); }
  }
  if (camAnim) {
    const k = clamp((performance.now() - camAnim.t0) / camAnim.dur, 0, 1), e = k * k * (3 - 2 * k);
    controls.target.lerpVectors(camAnim.t1, camAnim.t2, e); camera.position.lerpVectors(camAnim.p1, camAnim.p2, e);
    if (k >= 1) camAnim = null;
  }
  if (growing && now - lastGrow > 450) { lastGrow = now; growStep(); }
  applyHover(); controls.update();
  sky.position.copy(camera.position);
  updateTag();
  renderer.render(scene, camera);
});

setTime(15.5); renderUI();

// small handle for debugging / automated tests
window.sim = { plots, activeLots, select: (lot, part = 'lot') => setSelection({ lot, part }), buildHouse, expandHouse, demolishHouse, removeLot, addLot, validate,
  screenPos: (lot, part = 'lot') => { const c = lotPoint(lot, 0.5, part === 'house' ? 0.3 : 0.9); const v = new THREE.Vector3(c.x, part === 'house' ? GROUND_Y + 3 : GROUND_Y, c.z).project(camera);
    return { x: (v.x * 0.5 + 0.5) * innerWidth, y: (-v.y * 0.5 + 0.5) * innerHeight }; } };
</script>
</body>
